name: Repackage CatchAll Skill

on:
  push:
    paths:
      - 'Claude/CatchAll-SKILL/**'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Package skill into .skill file
        run: |
          cd Claude/CatchAll-SKILL
          zip -r ../CatchAll-SKILL.zip . -x "*.DS_Store" -x "__pycache__/*"

      - name: Commit updated .skill file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CatchAll-SKILL.zip
          git diff --staged --quiet || git commit -m "chore: regenerate CatchAll-SKILL.zip [skip ci]"
          git push